[workspace]
resolver = "3"
members = ["lib", "cli"]

[workspace.metadata.crane]
name = "horizon"

[workspace.dependencies]
horizon-lib = { path = "lib" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eb792265a67b2c6865f9b8c9ed9d2e5ae5a7174c", features = ["rkyv"] }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "970459d100ddee5f62a76c05642ecfabefba6329" }
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
