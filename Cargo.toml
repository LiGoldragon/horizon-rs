[workspace]
resolver = "3"
members = ["lib", "cli"]

[workspace.dependencies]
horizon-lib = { path = "lib" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
nota  = { git = "https://github.com/LiGoldragon/nota.git", rev = "f8de7a516b769fc544c7f8c0030e258833c1cf9b" }
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
ipnet      = { version = "2", features = ["serde"] }
