[workspace]
resolver = "3"
members = ["lib", "cli"]

[workspace.metadata.crane]
name = "horizon"

[workspace.dependencies]
horizon-lib = { path = "lib" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
protos = { git = "https://github.com/LiGoldragon/protos", rev = "2d999f173334" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "41a3c073d5c5" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "341c5c57e45d98ee7d8a88d9b5746d3f50b16683" }
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
