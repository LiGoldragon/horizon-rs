[workspace]
resolver = "3"
members = ["lib", "cli"]

[workspace.metadata.crane]
name = "horizon"

[workspace.dependencies]
horizon-lib = { path = "lib" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "9bffbf14f8de54a9d8f25a9fcf9120061401ded2" }
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4695ee0c1f5d00dcf5cceba08f5fa00412b92184" }
thiserror  = "2"
clap       = { version = "4", features = ["derive"] }
